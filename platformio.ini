[platformio]
src_dir = CORDON/firmware
include_dir = CORDON/firmware/include
default_envs = gateway, repeater, sensor

[env]
platform = espressif32
board = seeed_xiao_esp32c3
framework = arduino
monitor_speed = 115200
build_flags =
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
lib_deps =
    jgromes/RadioLib @ ^6.6.0

[env:gateway]
build_src_filter = -<*> +<src_gateway/*>

[env:repeater]
build_src_filter = -<*> +<src_repeater/*>

[env:sensor]
build_src_filter = -<*> +<src_sensor/*>
