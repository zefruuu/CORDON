<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>CORDON // Tactical Monitoring</title>
    <link rel="stylesheet" href="static/css/leaflet.css" />
    <link rel="stylesheet" href="static/css/style.css" />
</head>
<body>

<div id="auth-overlay" class="auth-overlay">
    <div class="auth-box">
        <div class="auth-header">CLASSIFIED // SYSTEM «CORDON»</div>
        <div class="auth-subtitle">TACTICAL PERIMETER DEFENSE TERMINAL</div>
        <form id="auth-form" autocomplete="off">
            <div class="auth-field">
                <label>OPERATOR ID:</label>
                <input id="auth-login" type="text" class="tactical-input" placeholder="Enter callsign..." required />
            </div>
            <div class="auth-field">
                <label>SECURITY KEY:</label>
                <input id="auth-password" type="password" class="tactical-input" placeholder="••••••••••••" required />
            </div>
            <div id="auth-error" class="auth-error">ACCESS DENIED: INVALID CREDENTIALS</div>
            <button type="submit" class="tactical-btn auth-submit">AUTHENTICATE ACCESS</button>
        </form>
    </div>
</div>

<div class="hud-panel">
    <div class="hud-header-row">
        <div class="hud-title" style="margin-bottom:0; border-bottom:none; padding-bottom:0;">SYSTEM «CORDON»</div>
        <button id="btn-lock" class="tactical-btn tactical-btn-danger" style="flex:0 0 auto; padding:3px 7px; font-size:10px;">LOCK</button>
    </div>
    <div style="border-bottom: 1px solid #2a3b5c; margin-bottom: 12px; margin-top: 6px;"></div>
    <div>NETWORK STATUS: <span id="system-status" class="status-badge">MONITORING</span></div>
    <div style="margin-top: 10px;">LAST EVENT:</div>
    <div id="event-desc" style="color: #8899a6; font-size: 12px; margin-top: 4px;">No active threats</div>

    <div style="margin-top: 14px; font-weight: bold; font-size: 12px;">SENSOR DEPLOYMENT:</div>
    <div class="coord-inputs">
        <input id="input-lat" type="number" step="0.0001" placeholder="Lat (50.4501)" class="tactical-input" />
        <input id="input-lng" type="number" step="0.0001" placeholder="Lon (30.5234)" class="tactical-input" />
        <input id="input-rad" type="number" min="5" max="10" value="7" title="Radius (5-10m)" class="tactical-input tactical-input-sm" />
    </div>
    <div class="hud-controls">
        <button id="btn-deploy-coords" class="tactical-btn">ADD BY INPUT</button>
        <button id="btn-add-sensor" class="tactical-btn">+ MAP CLICK [N]</button>
        <button id="btn-clear-sensors" class="tactical-btn tactical-btn-danger">CLEAR</button>
    </div>

    <div style="margin-top: 12px; font-weight: bold; font-size: 12px;">SIMULATE TRIGGER:</div>
    <div class="hud-controls">
        <button id="btn-sim-pir" class="tactical-btn">PIR (YELLOW)</button>
        <button id="btn-sim-bio" class="tactical-btn">BIO (ORANGE)</button>
        <button id="btn-sim-armed" class="tactical-btn tactical-btn-danger">ARMED (RED)</button>
    </div>

    <div style="margin-top: 14px; font-weight: bold; font-size: 12px;">EVENT LOG:</div>
    <div class="log-box" id="event-log"></div>
</div>

<div id="map"></div>

<script src="static/js/leaflet.js"></script>
<script src="static/js/app.js"></script>
</body>
</html>
